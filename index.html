<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#153958">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EEA Portal">
  <title>Expressive English Academy | Plataforma y App de Aprendizaje</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="LOGO%20EEA.jpg">
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            eeaNavy: '#153958',
            eeaGreen: '#176951',
            eeaBg: '#f2f5f2'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f2f5f2; color: #18354a; font-family: system-ui, -apple-system, sans-serif; }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom, 12px), 12px); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="access-message" class="max-w-xl mx-auto my-8 p-4 bg-white border border-slate-200 rounded-2xl shadow-sm text-center" hidden></div>
  <div id="app" class="flex-1 flex flex-col"></div>

  <!-- Scripts oficiales de EEA -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
  <script>
    // Registro del Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
